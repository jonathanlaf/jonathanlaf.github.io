name: Refresh public GitHub activity
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_contributions.py
      - run: python scripts/update_repositories.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save refreshed public counts
        run: |
          if git diff --quiet -- assets/contributions.json assets/repositories.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.json assets/repositories.json
          git commit -m "chore: refresh public GitHub activity"
          git push

      - name: Publish refreshed snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
